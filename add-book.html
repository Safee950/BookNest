<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Book - BookNest Library</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="dashboard.html"><i class="bi bi-book-half"></i> BookNest</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="books.html">Books</a></li>
          <li class="nav-item"><a class="nav-link active" href="add-book.html">Add Book</a></li>
          <li class="nav-item"><a class="nav-link" href="members.html">Members</a></li>
          <li class="nav-item"><a class="nav-link" href="issue-book.html">Issue / Return</a></li>
          <li class="nav-item"><a class="nav-link" href="fines.html">Fines</a></li>
        </ul>
        <div class="dropdown">
          <a class="btn btn-light btn-sm dropdown-toggle" href="#" data-bs-toggle="dropdown">
            <i class="bi bi-person-circle"></i> Admin
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="profile.html">My Profile</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="login.html">Logout</a></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="books.html">Books</a></li>
        <li class="breadcrumb-item active">Add Book</li>
      </ol>
    </nav>
    <div class="card shadow-sm">
      <div class="card-header bg-white"><strong>Add New Book</strong></div>
      <div class="card-body">
        <form id="bookForm">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Book Title</label>
              <input type="text" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Author</label>
              <input type="text" class="form-control" required>
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">ISBN</label>
              <input type="text" class="form-control">
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">Category</label>
              <select class="form-select" required>
                <option value="">Select category</option>
                <option>Computer Science</option>
                <option>Mathematics</option>
                <option>Web</option>
                <option>Novels</option>
              </select>
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">Number of Copies</label>
              <input type="number" class="form-control" min="1" value="1" required>
            </div>
            <div class="col-12 mb-3">
              <label class="form-label">Description</label>
              <textarea class="form-control" rows="3"></textarea>
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Save Book</button>
          <a href="books.html" class="btn btn-secondary">Cancel</a>
        </form>
      </div>
    </div>
  </div>

  <footer class="bg-dark text-white text-center py-3 mt-5">
    <small>&copy; 2026 BookNest Library Management System</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
